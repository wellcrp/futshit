<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Ranking - Escala de Jogadores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body{padding-top:56px}
      .player-name{font-weight:600}
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Escala - Futebol Society</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="/admin/">Painel Admin</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container">
      <div class="row">
        <div class="col-12 col-lg-8 offset-lg-2">
          <div class="card shadow-sm">
            <div class="card-body">
              <h2 class="card-title">Ranking de Jogadores</h2>
              <p class="text-muted">Pontuação por presença (1 ponto por jogo). Lista atualizada automaticamente.</p>
              <p class="text-muted">Total de jogos: <strong id="totalGames">—</strong></p>
              <p class="text-muted">Campo do último jogo: <strong id="campoName">—</strong></p>

              <div id="content"> <div class="text-center py-4">Carregando...</div> </div>
            </div>
          </div>
          <footer class="text-center text-muted small mt-3">Última atualização: <span id="updated">—</span></footer>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      function createTable(data, totalGames){
        if(!data || !data.length) return '<div class="alert alert-info">Sem dados para exibir.</div>';
        const rows = data.map((row, i) => {
          const qtdeJogos = Number(totalGames || 0);
          const aproveitamento = Number(row.aproveitamento ?? (totalGames ? (Number(row.pontos || 0) / totalGames) * 100 : 0));
          return `
            <tr>
              <th scope="row">${i+1}</th>
              <td class="player-name">${escapeHtml(row.nome)}</td>
              <td><a href="#" class="player-game-link btn btn-sm btn-outline-primary" data-player="${escapeHtml(row.nome)}">Ver jogo</a></td>
              <td><span class="badge bg-success">${row.pontos}</span></td>
              <td>${qtdeJogos}</td>
              <td><span class="badge bg-info text-dark">${aproveitamento.toFixed(1)}%</span></td>
            </tr>
          `;
        }).join('');

        return `
          <div class="table-responsive">
            <table class="table table-striped table-hover">
              <thead class="table-light">
                <tr><th>Pos.</th><th>Jogador</th><th>Jogo</th><th>Pontos</th><th>Qtde Jogos ⚽</th><th>Aproveitamento %</th></tr>
              </thead>
              <tbody>
                ${rows}
              </tbody>
            </table>
          </div>
        `;
      }

      function escapeHtml(text){
        if(!text) return '';
        return text.replace(/[&<>"']/g, function(m){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"})[m]; });
      }

      async function load(){
        try{
          const [rankingRes, jogosRes] = await Promise.all([
            fetch('/api/ranking'),
            fetch('/api/jogos')
          ]);
          if(!rankingRes.ok || !jogosRes.ok) throw new Error('Erro na requisição');

          const data = await rankingRes.json();
          const jogos = await jogosRes.json();
          // disponibiliza os jogos globalmente para o modal
          window._jogos = jogos;
          const totalGames = Array.isArray(jogos) ? jogos.length : 0;
          const lastField = Array.isArray(jogos) && jogos.length ? jogos[jogos.length - 1].campo || '—' : '—';
          document.getElementById('totalGames').innerText = String(totalGames);
          document.getElementById('campoName').innerText = escapeHtml(lastField);
          document.getElementById('content').innerHTML = createTable(data, totalGames);
          document.getElementById('updated').innerText = new Date().toLocaleString();
        }catch(e){
          document.getElementById('content').innerHTML = '<div class="alert alert-danger">Falha ao carregar dados.</div>';
          document.getElementById('totalGames').innerText = '0';
          console.error(e);
        }
      }

      load();
      // opcional: atualizar a cada 60s
      setInterval(load, 60000);

      // Modal para exibir jogos de um jogador
      function formatDate(iso){
        if(!iso) return '';
        // Prefer manual YYYY-MM-DD -> DD/MM/YYYY to avoid timezone shifts
        const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
        if(m) return `${m[3]}/${m[2]}/${m[1]}`;
        try{ return new Date(iso).toLocaleDateString(); }catch(e){ return iso; }
      }

      function showPlayerModal(player){
        const jogos = window._jogos || [];
        const entries = jogos
          .filter(j => Array.isArray(j.lista) && j.lista.some(name => name && name.toLowerCase().trim() === player.toLowerCase().trim()))
          .sort((a, b) => {
            if (!a.data) return 1;
            if (!b.data) return -1;
            return b.data.localeCompare(a.data); // YYYY-MM-DD lexicographic sort -> desc
          });
        const body = entries.length ? entries.map(e => `
          <div class="mb-2">
            <div><strong>Dia do jogo:</strong> ${escapeHtml(formatDate(e.data))}</div>
            <div><strong>Campo:</strong> ${escapeHtml(e.campo)}</div>
          </div>
        `).join('') : '<div class="text-muted">Nenhum jogo encontrado para este jogador.</div>';

        const modalEl = document.getElementById('playerModal');
        if(!modalEl) return;
        modalEl.querySelector('.modal-title').innerText = player;
        modalEl.querySelector('.modal-body').innerHTML = body;
        const bs = new bootstrap.Modal(modalEl);
        bs.show();
      }

      // delegação de clique na coluna 'Jogo'
      document.addEventListener('click', function(e){
        const a = (e.target && (e.target.closest ? e.target.closest('.player-game-link') : null));
        if(a){
          e.preventDefault();
          const player = a.getAttribute('data-player') || a.innerText;
          showPlayerModal(player);
        }
      });
    </script>

    <!-- Modal -->
    <div class="modal fade" id="playerModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Jogador</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
          </div>
          <div class="modal-body">
            <!-- conteúdo preenchido dinamicamente -->
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
